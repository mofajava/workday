<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做二休二排班行事曆</title>
    <style>
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --work-bg: #e3f2fd;
            --work-color: #0d47a1;
            --off-bg: #e8f5e9;
            --off-color: #1b5e20;
            --today-border: #ff9800;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            font-size: 24px;
        }
        .setup-box {
            background-color: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid #e9ecef;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #495057;
        }
        input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .color-box.work { background-color: var(--work-bg); border: 1px solid var(--work-color); }
        .color-box.off { background-color: var(--off-bg); border: 1px solid var(--off-color); }
        
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-controls button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .calendar-controls button:hover {
            opacity: 0.9;
        }
        #month-label {
            font-size: 18px;
            font-weight: bold;
            color: #212529;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }
        .weekday {
            font-weight: 600;
            color: #6c757d;
            padding-bottom: 8px;
            font-size: 14px;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #f1f3f5;
            font-size: 14px;
            position: relative;
            cursor: default;
        }
        .day .badge {
            font-size: 10px;
            margin-top: 2px;
            font-weight: bold;
        }
        .day.work-day {
            background-color: var(--work-bg);
            color: var(--work-color);
            border-color: #bbdefb;
        }
        .day.off-day {
            background-color: var(--off-bg);
            color: var(--off-color);
            border-color: #c8e6c9;
        }
        .day.empty {
            background: transparent;
            border: none;
        }
        .day.today {
            box-shadow: 0 0 0 2px var(--today-border) inset;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>做二休二排班行事曆</h1>
    
    <div class="setup-box">
        <div class="form-group">
            <label for="base-date">設定第一天上班日：</label>
            <input type="date" id="base-date" value="2026-05-24">
        </div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="color-box work"></div>
            <span>上班日</span>
        </div>
        <div class="legend-item">
            <div class="color-box off"></div>
            <span>放假日</span>
        </div>
    </div>

    <div class="calendar-controls">
        <button id="prev-month">&lt; 上個月</button>
        <span id="month-label"></span>
        <button id="next-month">下個月 &gt;</button>
    </div>

    <div class="calendar-grid" id="calendar-grid">
        <!-- 由 JavaScript 動態生成 -->
    </div>
</div>

<script>
    let currentDate = new Date(2026, 5, 23); // 預設初始化在 2026 年 6 月
    const baseDateInput = document.getElementById('base-date');
    const monthLabel = document.getElementById('month-label');
    const calendarGrid = document.getElementById('calendar-grid');

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

    function getBaseDate() {
        return new Date(baseDateInput.value + "T00:00:00");
    }

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        monthLabel.textContent = `${year} 年 ${month + 1} 月`;
        
        // 渲染星期標頭
        weekdays.forEach(day => {
            const dayElem = document.createElement('div');
            dayElem.className = 'weekday';
            dayElem.textContent = day;
            calendarGrid.appendChild(dayElem);
        });

        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        // 填補當月第一天之前的空格
        for (let i = 0; i < firstDayOfMonth; i++) {
            const emptyElem = document.createElement('div');
            emptyElem.className = 'day empty';
            calendarGrid.appendChild(emptyElem);
        }

        // 渲染每一天
        const baseDate = getBaseDate();
        for (let d = 1; d <= daysInMonth; d++) {
            const thisDate = new Date(year, month, d);
            const dayElem = document.createElement('div');
            dayElem.className = 'day';
            
            // 檢查是否為今天
            if (thisDate.toDateString() === today.toDateString()) {
                dayElem.classList.add('today');
            }

            // 計算與基準日的差值
            const diffTime = thisDate.getTime() - baseDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            const dayNumElem = document.createElement('span');
            dayNumElem.textContent = d;
            dayElem.appendChild(dayNumElem);

            // 只有在基準日之後（或當天）才計算班表
            if (diffDays >= 0) {
                const cycleDay = diffDays % 4;
                const badgeElem = document.createElement('span');
                badgeElem.className = 'badge';
                
                if (cycleDay === 0 || cycleDay === 1) {
                    dayElem.classList.add('work-day');
                    badgeElem.textContent = '上班';
                } else {
                    dayElem.classList.add('off-day');
                    badgeElem.textContent = '放假';
                }
                dayElem.appendChild(badgeElem);
            }

            calendarGrid.appendChild(dayElem);
        }
    }

    baseDateInput.addEventListener('change', renderCalendar);
    
    document.getElementById('prev-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });

    // 初始渲染
    renderCalendar();
</script>

</body>
</html>
